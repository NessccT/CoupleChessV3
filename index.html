<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情侶飛行棋 情慾流動</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fcd5e5">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: "PingFang SC", "Microsoft JhengHei", sans-serif;
      text-align: center;
      background: #fcd5e5;
      margin: 0;
      padding: 12px 0 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部資訊列 */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #game-info {
      font-size: 19px;
      font-weight: 900;
      color: #e63946;
      background: rgba(255, 255, 255, 0.85);
      padding: 5px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .mode-badge {
      background: #ffffff;
      border: 2px solid #54a0ff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: bold;
      color: #2e86de;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: all 0.2s;
    }
    .mode-badge.public {
      background: #2e86de;
      color: #ffffff;
      border-color: #2e86de;
    }
    .mode-badge.private {
      background: #ff6b81;
      color: #ffffff;
      border-color: #ff6b81;
    }

    .memo-badge {
      background: #fff;
      border: 2px solid #ffa502;
      color: #e67e22;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: all 0.2s;
    }
    .memo-badge:hover {
      background: #ffa502;
      color: #fff;
    }

    /* 棋盤舞台與緊貼按鈕 */
    .game-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    canvas {
      background: #fce1ed;
      border: 4px solid #ffffff;
      border-radius: 32px;
      box-shadow: 0 10px 25px rgba(220, 100, 150, 0.25);
    }

    .side-btn {
      padding: 16px 10px;
      font-size: 14px;
      font-weight: bold;
      border: 3px solid #ffffff;
      border-radius: 18px;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .side-btn-red {
      background: linear-gradient(180deg, #ff6b81, #ff4757);
    }

    .side-btn-blue {
      background: linear-gradient(180deg, #54a0ff, #2e86de);
    }

    .side-btn:hover {
      transform: scale(1.06);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dice-container {
      perspective: 600px;
      width: 60px;
      height: 60px;
    }

    .dice {
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 3px solid #ff7b90;
      border-radius: 14px;
      box-shadow: 0 6px 0 #e56277, 0 10px 15px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 6px;
      transition: transform 0.1s ease;
    }

    .rolling {
      animation: dice-roll 0.6s linear infinite;
    }

    @keyframes dice-roll {
      0%   { transform: rotateX(0deg) rotateY(0deg) scale(1.1); }
      25%  { transform: rotateX(180deg) rotateY(90deg) scale(1.1); }
      50%  { transform: rotateX(360deg) rotateY(180deg) scale(1.1); }
      75%  { transform: rotateX(180deg) rotateY(270deg) scale(1.1); }
      100% { transform: rotateX(0deg) rotateY(360deg) scale(1.1); }
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #ff5277;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      visibility: hidden;
    }

    button#rollBtn {
      padding: 12px 36px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
      transition: all 0.2s;
    }

    button#rollBtn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none !important;
    }

    /* === 彈窗遮罩基礎 === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* === 歡迎與設定彈窗 === */
    .welcome-modal {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(220, 80, 130, 0.3);
      border: 4px solid #ff7b90;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .welcome-modal {
      transform: scale(1);
    }

    .welcome-icon {
      font-size: 46px;
      display: inline-block;
      animation: float-heart 2s ease-in-out infinite;
      margin-bottom: 6px;
    }

    @keyframes float-heart {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 900;
      color: #e63946;
      margin-bottom: 6px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .mode-cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mode-card {
      border-radius: 18px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      border: 2.5px solid transparent;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mode-card-private {
      background: #fff0f3;
      border-color: #ffd1dc;
    }
    .mode-card-private:hover {
      border-color: #ff4757;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 71, 87, 0.2);
    }

    .mode-card-public {
      background: #f0f7ff;
      border-color: #cfe2ff;
    }
    .mode-card-public:hover {
      border-color: #2e86de;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 134, 222, 0.2);
    }

    .card-icon {
      font-size: 32px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.35;
    }

    /* 骰子點數上限群組 */
    .dice-limit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .dice-limit-btn {
      background: #fff0f3;
      border: 2.5px solid #ff7b90;
      border-radius: 16px;
      padding: 14px 0;
      font-size: 18px;
      font-weight: 900;
      color: #e63946;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dice-limit-btn span {
      font-size: 12px;
      font-weight: normal;
      color: #888;
    }

    .dice-limit-btn:hover {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border-color: #ff758c;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 117, 140, 0.35);
    }
    .dice-limit-btn:hover span {
      color: #fff;
    }

    /* 任務彈窗 */
    .task-modal {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 28px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      border: 4px solid #ff7b90;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .task-modal {
      transform: scale(1);
    }

    .modal-tag {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 12px;
      color: #fff;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 16px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-timer-badge {
      background: #fff0f3;
      border: 2px dashed #ff758c;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 18px;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 16px;
      font-family: 'Courier New', Courier, monospace;
    }

    .modal-btn {
      width: 100%;
      padding: 11px 0;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: #ff758c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn:hover {
      background: #ff5277;
    }

    /* 任務編輯視窗 */
    .edit-modal {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border: 4px solid #ff7b90;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .edit-modal {
      transform: scale(1);
    }

    .edit-modal-header {
      font-size: 19px;
      font-weight: 900;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eee;
    }

    .edit-list {
      flex: 1;
      overflow-y: auto;
      text-align: left;
      padding-right: 5px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .edit-item {
      background: #fff5f7;
      border: 1.5px solid #ffd1dc;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edit-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #444;
      font-size: 14px;
    }

    .edit-item input, .edit-item textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .edit-item input:focus, .edit-item textarea:focus {
      border-color: #ff758c;
    }

    .edit-item textarea {
      resize: vertical;
      height: 48px;
    }

    .duration-input {
      width: 65px !important;
      text-align: center;
    }

    .edit-modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .edit-modal-footer .modal-btn {
      padding: 9px 0;
      font-size: 14px;
    }

    .cancel-btn {
      background: #bbb;
    }
    .reset-btn {
      background: #ffa502;
    }
    .reset-btn:hover {
      background: #ff7f50;
    }

    /* === 📝 任務備忘錄彈窗 === */
    .memo-modal {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 480px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border: 4px solid #ffa502;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .memo-modal {
      transform: scale(1);
    }

    .memo-add-box {
      background: #fff8eb;
      border: 1.5px dashed #ffa502;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      text-align: left;
    }
    .memo-add-box input, .memo-add-box textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .memo-add-box textarea {
      height: 40px;
      resize: vertical;
    }

    .memo-list {
      flex: 1;
      overflow-y: auto;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .memo-card-item {
      background: #fffdf9;
      border: 1.5px solid #ffeaa7;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .memo-card-title {
      font-weight: bold;
      color: #d35400;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .memo-card-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }
    .memo-card-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .memo-action-btn {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .memo-apply-btn {
      background: #ffa502;
      color: #fff;
    }
    .memo-del-btn {
      background: #ff7675;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="game-info">💖 紅方回合</div>
    <div class="mode-badge public" id="modeBtn" onclick="openWelcomeModal()">🌐 雲端公用版 (最大 6 點)</div>
    <div class="memo-badge" onclick="openMemoModal()">📝 任務備忘錄</div>
  </div>

  <div class="game-stage">
    <button class="side-btn side-btn-red" onclick="openEditorModal('odd')">✏️ 紅方編輯 奇數格</button>
    <canvas id="gameCanvas" width="560" height="580"></canvas>
    <button class="side-btn side-btn-blue" onclick="openEditorModal('even')">✏️ 藍方編輯 偶數格</button>
  </div>

  <div class="controls">
    <div class="dice-container">
      <div class="dice" id="diceElement">
        <div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div><div class="dot" id="d4"></div><div class="dot" id="d5"></div>
        <div class="dot" id="d6"></div><div class="dot" id="d7"></div><div class="dot" id="d8"></div>
      </div>
    </div>
    <button id="rollBtn" onclick="rollDice()">擲骰子 🎲</button>
  </div>

  <div class="modal-overlay active" id="welcomeModalOverlay">
    <div class="welcome-modal">
      <div id="welcomeStep1">
        <div class="welcome-icon">💖✨</div>
        <div class="welcome-title">情侶飛行棋</div>
        <div class="welcome-subtitle">請選擇今天想遊玩的模式～</div>

        <div class="mode-cards-container">
          <div class="mode-card mode-card-private" onclick="goToStep2('private')">
            <div class="card-icon">📱</div>
            <div>
              <div class="card-title">本地私密版</div>
              <div class="card-desc">這裡沒有第三者！寫下你最渴望的變態指令，今晚誰輸了就得乖乖任由擺佈...🥵</div>
            </div>
          </div>

          <div class="mode-card mode-card-public" onclick="goToStep2('public')">
            <div class="card-icon">☁️</div>
            <div>
              <div class="card-title">雲端公用版</div>
              <div class="card-desc">匯集所有情侶的淫蕩玩法！同步連線更新，今晚一起把另一半徹底調教到求饒～😈</div>
            </div>
          </div>
        </div>
      </div>

      <div id="welcomeStep2" style="display: none;">
        <div class="welcome-icon">🎲✨</div>
        <div class="welcome-title">設定骰子上限</div>
        <div class="welcome-subtitle">你的骰子最大可以骰到幾點呢？</div>

        <div class="dice-limit-grid">
          <div class="dice-limit-btn" onclick="finishSetup(1)">1 點<span>慢慢前進</span></div>
          <div class="dice-limit-btn" onclick="finishSetup(2)">2 點<span>細細品味</span></div>
          <div class="dice-limit-btn" onclick="finishSetup(3)">3 點<span>微醺節奏</span></div>
          <div class="dice-limit-btn" onclick="finishSetup(4)">4 點<span>甜蜜互動</span></div>
          <div class="dice-limit-btn" onclick="finishSetup(5)">5 點<span>熱情加速</span></div>
          <div class="dice-limit-btn" onclick="finishSetup(6)">6 點<span>經典滿速</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="taskModalOverlay">
    <div class="task-modal">
      <div class="modal-tag" id="modalTag">第 1 格</div>
      <div class="modal-title" id="modalTitle">任務名稱</div>
      <div class="modal-desc" id="modalDesc">任務內容描述</div>
      <div class="modal-timer-badge" id="modalTimerBadge" style="display: none;">⏳ 準備中: 3s</div>
      <button class="modal-btn" id="modalConfirmBtn" onclick="closeTaskModal()">完成任務 ✨</button>
    </div>
  </div>

  <div class="modal-overlay" id="editModalOverlay">
    <div class="edit-modal" id="editModalBox">
      <div class="edit-modal-header" id="editModalTitle">編輯任務清單</div>
      <div class="edit-list" id="editListContainer"></div>
      <div class="edit-modal-footer">
        <button class="modal-btn reset-btn" onclick="resetToDefaultTasks()">重設預設 🔄</button>
        <button class="modal-btn cancel-btn" onclick="closeEditorModal()">取消</button>
        <button class="modal-btn" onclick="saveTasksFromEditor()">儲存任務 💾</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="memoModalOverlay">
    <div class="memo-modal">
      <div class="edit-modal-header" style="color:#d35400;">📝 任務備忘錄 (防洗白靈感庫)</div>
      
      <div class="memo-add-box">
        <div style="font-size:13px; font-weight:bold; color:#d35400;">＋ 收藏一則新任務靈感</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="newMemoTitle" placeholder="靈感標題 (例: 舌尖挑逗)" style="flex:2;">
          <input type="number" id="newMemoDur" placeholder="秒數" style="flex:1;" min="0" value="0">
        </div>
        <textarea id="newMemoDesc" placeholder="任務詳細內容..."></textarea>
        <button class="modal-btn" style="background:#ffa502; padding:6px 0; font-size:13px;" onclick="addMemoItem()">新增至備忘錄 📌</button>
      </div>

      <div class="memo-list" id="memoListContainer"></div>

      <div class="edit-modal-footer" style="margin-top:10px;">
        <button class="modal-btn cancel-btn" onclick="closeMemoModal()">關閉備忘錄</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ☁️ 1. Firebase 設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAyfbvi0HCbNF95384gf3qLn1_CazaD3XM",
      authDomain: "couple-chessv3.firebaseapp.com",

        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);

      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.4);
      ctx.bezierCurveTo(x - size, y + size * 0.8, x, y + size * 1.1, x, y + size * 1.3);
      ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.8, x + size, y + size * 0.4);
      ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const size = 36;

      track.forEach((tile) => {
        const x = tile.x - size / 2;
        const y = tile.y - size / 2;

        ctx.fillStyle = tile.theme.shadow;
        drawRoundedRect(x, y + 3, size, size, 9);
        ctx.fill();

        ctx.fillStyle = tile.theme.bg;
        drawRoundedRect(x, y, size, size, 9);
        ctx.fill();

        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 2;
        drawRoundedRect(x, y, size, size + 3, 9);
        ctx.stroke();

        if (tile.type === 'start') {
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 15px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("◀◀", tile.x, tile.y + 1);
        } else if (tile.type === 'end') {
          ctx.fillStyle = "#333333";
          ctx.font = "bold 20px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("⚑", tile.x, tile.y);
        } else {
          drawHeart(tile.x, tile.y - 9, 7, "rgba(255, 255, 255, 0.35)");
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 14px 'Arial Black', Impact, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(tile.num, tile.x, tile.y + 2);
        }
      });

      players.forEach((p, idx) => {
        let offset = (players[0].pos === players[1].pos && !isAnimating) ? (idx === 0 ? -7 : 7) : 0;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.renderX + offset, p.renderY + offset, 10, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(p.renderX + offset, p.renderY + offset, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }

    function animateMovement(player, targetIndices, onComplete) {
      if (targetIndices.length === 0) {
        onComplete();
        return;
      }

      let leg = 0;
      let startTime = null;
      const duration = 200;

      let startX = player.renderX;
      let startY = player.renderY;
      let destX = track[targetIndices[0]].x;
      let destY = track[targetIndices[0]].y;

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const t = Math.min((timestamp - startTime) / duration, 1);
        const bounce = Math.sin(t * Math.PI) * 12;

        player.renderX = startX + (destX - startX) * t;
        player.renderY = startY + (destY - startY) * t - bounce;

        drawBoard();

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          leg++;
          if (leg < targetIndices.length) {
            startX = destX;
            startY = destY;
            destX = track[targetIndices[leg]].x;
            destY = track[targetIndices[leg]].y;
            startTime = timestamp;
            requestAnimationFrame(step);
          } else {
            player.renderX = destX;
            player.renderY = destY;
            drawBoard();
            onComplete();
          }
        }
      }
      requestAnimationFrame(step);
    }

    const dicePatterns = {
      1: [4], 2: [2, 6], 3: [2, 4, 6],
      4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
    };

    function updateDiceFace(val) {
      for (let i = 0; i < 9; i++) document.getElementById(`d${i}`).style.visibility = 'hidden';
      dicePatterns[val].forEach(idx => document.getElementById(`d${idx}`).style.visibility = 'visible');
    }

    function rollDice() {
      if (isAnimating) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      isAnimating = true;
      rollBtn.disabled = true;
      diceEl.classList.add('rolling');

      let rollCount = 0;
      const rollInterval = setInterval(() => {
        const randVal = Math.floor(Math.random() * maxDiceLimit) + 1;
        updateDiceFace(randVal);
        rollCount++;

        if (rollCount >= 10) {
          clearInterval(rollInterval);
          diceEl.classList.remove('rolling');
          const finalDice = Math.floor(Math.random() * maxDiceLimit) + 1;
          updateDiceFace(finalDice);
          lastRolledDice = finalDice;
          processTurn(finalDice);
        }
      }, 60);
    }

    function processTurn(dice) {
      const player = players[currentTurn];
      const maxIdx = track.length - 1;
      const targetPos = Math.min(player.pos + dice, maxIdx);
      const waypoints = [];
      for (let p = player.pos + 1; p <= targetPos; p++) waypoints.push(p);

      player.pos = targetPos;
      animateMovement(player, waypoints, () => showTaskModal(player, player.pos));
    }

    function showTaskModal(player, posIdx) {
      const tileNum = posIdx + 1;
      const task = tileTasks[tileNum] || { title: `第 ${tileNum} 格`, desc: "自由互動時間！", duration: 0 };

      modalTag.innerText = `${player.name} 抵達 第 ${tileNum} 格`;
      modalTag.style.background = player.color;
      modalTitle.innerText = task.title;
      modalDesc.innerText = task.desc;

      modalOverlay.classList.add('active');
      startAutoTaskTimer(task.duration);
    }

    function closeTaskModal() {
      stopTaskTimer();
      modalOverlay.classList.remove('active');

      const maxIdx = track.length - 1;
      const player = players[currentTurn];

      if (player.pos === maxIdx) {
        infoText.innerText = `👑 恭喜 ${player.name} 抵達 50 格終點獲勝！`;
        infoText.style.color = player.color;
        rollBtn.disabled = true;
        isAnimating = false;
        return;
      }

      currentTurn = 1 - currentTurn;
      infoText.innerText = `💖 輪到 ${players[currentTurn].name} (上回合擲出 ${lastRolledDice} 點)`;
      infoText.style.color = players[currentTurn].color;
      
      isAnimating = false;
      rollBtn.disabled = false;
    }

    updateDiceFace(1);
    drawBoard();
  </script>
</body>
