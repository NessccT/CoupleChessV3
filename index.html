      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

      font-size: 20px;
      font-weight: 900;
      color: #e63946;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);

    .mode-badge {
      background: #ffffff;
      border: 2px solid #54a0ff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: bold;

      align-items: center;
      gap: 4px;

      transition: all 0.2s;

    .mode-badge.public {
      background: #2e86de;
      color: #ffffff;
    }

    /* 棋盤舞台與緊貼按鈕 */
    .game-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    canvas {
      background: #fce1ed;
      border: 4px solid #ffffff;
      border-radius: 32px;
      box-shadow: 0 10px 25px rgba(220, 100, 150, 0.25);
    }

    .side-btn {
      padding: 16px 10px;
      font-size: 14px;
      font-weight: bold;
      border: 3px solid #ffffff;
      border-radius: 18px;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .side-btn-red {
      background: linear-gradient(180deg, #ff6b81, #ff4757);
    }

    .side-btn-blue {
      background: linear-gradient(180deg, #54a0ff, #2e86de);
    }

    .side-btn:hover {
      transform: scale(1.06);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dice-container {
      perspective: 600px;
      width: 60px;
      height: 60px;
    }

    .dice {
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 3px solid #ff7b90;
      border-radius: 14px;
      box-shadow: 0 6px 0 #e56277, 0 10px 15px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 6px;
      transition: transform 0.1s ease;
    }

    .rolling {
      animation: dice-roll 0.6s linear infinite;
    }

    @keyframes dice-roll {
      0%   { transform: rotateX(0deg) rotateY(0deg) scale(1.1); }
      25%  { transform: rotateX(180deg) rotateY(90deg) scale(1.1); }
      50%  { transform: rotateX(360deg) rotateY(180deg) scale(1.1); }
      75%  { transform: rotateX(180deg) rotateY(270deg) scale(1.1); }
      100% { transform: rotateX(0deg) rotateY(360deg) scale(1.1); }
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #ff5277;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      visibility: hidden;
    }

    button#rollBtn {
      padding: 12px 36px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
      transition: all 0.2s;

    button#rollBtn:disabled {

      box-shadow: none;
      cursor: not-allowed;
      transform: none !important;

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);

      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .task-modal {
      background: #ffffff;
      border-radius: 24px;

      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);

      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    .modal-overlay.active .task-modal {

    .modal-tag {

      font-weight: bold;

    .modal-desc {

      line-height: 1.5;
      margin-bottom: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-timer-badge {
      background: #fff0f3;
      border: 2px dashed #ff758c;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 18px;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 16px;
      font-family: 'Courier New', Courier, monospace;
    }

    .modal-btn {
      width: 100%;
      padding: 11px 0;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: #ff758c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn:hover {
      background: #ff5277;
    }

    /* 任務編輯視窗 */
    .edit-modal {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border: 4px solid #ff7b90;
      transform: scale(0.8);

      font-weight: 900;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eee;

    .edit-list {

      text-align: left;
      padding-right: 5px;
      display: flex;
      flex-direction: column;
      gap: 12px;

    .edit-item {
      background: #fff5f7;

      display: flex;

      align-items: center;
      font-weight: bold;
      color: #444;

      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
      font-family: inherit;

    }

    .duration-input {

      text-align: center;
    }

    .edit-modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .cancel-btn {
      background: #bbb;
    }

    let tileTasks = defaultTasks;

    // 監聽 Firebase 雲端更新
    if (isFirebaseReady) {
      dbRef.on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData && isCloudMode) {
          tileTasks = cloudData;
        } else if (!cloudData) {
          dbRef.set(defaultTasks);
        }
      });
    }

    function toggleMode() {
      isCloudMode = !isCloudMode;
      const btn = document.getElementById('modeBtn');
      if (isCloudMode) {
        btn.innerText = "🌐 公用雲端版 (已連線)";
        btn.classList.add('public');
        if (isFirebaseReady) {
          dbRef.once('value').then(snap => {
            if (snap.val()) tileTasks = snap.val();
          });
        }
      } else {
        btn.innerText = "📱 本地私密版";
        btn.classList.remove('public');
        tileTasks = JSON.parse(localStorage.getItem('couple_ludo_tasks_50')) || defaultTasks;
      }
    }

    // ==========================================
    // 📝 4. 編輯與同步邏輯
    // ==========================================
    const editModalOverlay = document.getElementById('editModalOverlay');
    const editModalTitle = document.getElementById('editModalTitle');
    const editListContainer = document.getElementById('editListContainer');
    const editModalBox = document.getElementById('editModalBox');
    let currentEditType = 'odd';

    function openEditorModal(type) {
      currentEditType = type;
      const isOdd = (type === 'odd');

      editModalTitle.innerText = isOdd ? "✏️ 紅方編輯 奇數格任務" : "✏️ 藍方編輯 偶數格任務";
      editModalBox.style.borderColor = isOdd ? "#ff7b90" : "#54a0ff";

      editListContainer.innerHTML = '';

      for (let i = 1; i <= 50; i++) {
        if ((isOdd && i % 2 === 1) || (!isOdd && i % 2 === 0)) {
          const task = tileTasks[i] || { title: "", desc: "", duration: 0 };
          const itemDiv = document.createElement('div');
          itemDiv.className = 'edit-item';
          itemDiv.innerHTML = `
            <div class="edit-item-header">
              <span>第 ${i} 格</span>
              <div>
                倒數: 
                <input type="number" class="duration-input" id="edit-dur-${i}" min="0" value="${task.duration || 0}"> 秒 (0=不計時)
              </div>
            </div>
            <input type="text" id="edit-title-${i}" placeholder="任務標題" value="${task.title}">
            <textarea id="edit-desc-${i}" placeholder="任務詳細內容">${task.desc}</textarea>
          `;
          editListContainer.appendChild(itemDiv);
        }
      }

      editModalOverlay.classList.add('active');
    }

    function closeEditorModal() {
      editModalOverlay.classList.remove('active');
    }

    function saveTasksFromEditor() {
      const isOdd = (currentEditType === 'odd');

      for (let i = 1; i <= 50; i++) {
        if ((isOdd && i % 2 === 1) || (!isOdd && i % 2 === 0)) {
          const titleInput = document.getElementById(`edit-title-${i}`);
          const descInput = document.getElementById(`edit-desc-${i}`);
          const durInput = document.getElementById(`edit-dur-${i}`);

          if (titleInput && descInput && durInput) {
            tileTasks[i] = {
              title: titleInput.value.trim() || `第 ${i} 格`,
              desc: descInput.value.trim() || "自由互動時間！",
              duration: parseInt(durInput.value) || 0
            };
          }
        }
      }

      localStorage.setItem('couple_ludo_tasks_50', JSON.stringify(tileTasks));

      if (isFirebaseReady && isCloudMode) {
        dbRef.set(tileTasks);
        alert("✅ 已成功儲存並同步至雲端公用版本！");
      } else {
        alert("✅ 已成功儲存至本機！");
      }

      closeEditorModal();
    }

    // ==========================================
    // ⏱️ 5. 倒數計時邏輯
    // ==========================================
    let autoTimerInterval = null;
    const modalTimerBadge = document.getElementById('modalTimerBadge');

    function startAutoTaskTimer(taskDuration) {
      clearInterval(autoTimerInterval);

      if (!taskDuration || taskDuration <= 0) {
        modalTimerBadge.style.display = 'none';
        return;
      }

      modalTimerBadge.style.display = 'block';
      let prepCount = 3;
      modalTimerBadge.innerText = `⏳ 準備倒數: ${prepCount}s`;

      autoTimerInterval = setInterval(() => {
        prepCount--;
        if (prepCount > 0) {
          modalTimerBadge.innerText = `⏳ 準備倒數: ${prepCount}s`;
        } else {
          clearInterval(autoTimerInterval);
          let remainTime = taskDuration;
          modalTimerBadge.innerText = `🔥 進行中: ${remainTime}s`;

          autoTimerInterval = setInterval(() => {
            remainTime--;
            if (remainTime > 0) {
              modalTimerBadge.innerText = `🔥 進行中: ${remainTime}s`;
            } else {
              clearInterval(autoTimerInterval);
              modalTimerBadge.innerText = `🎉 時間到！任務完成！`;
              playDingSound();
            }
          }, 1000);
        }
      }, 1000);
    }

    function stopTaskTimer() {
      clearInterval(autoTimerInterval);
    }

    // ==========================================
    // 💖 6. 50 格雙愛心棋盤幾何與動畫
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const infoText = document.getElementById('game-info');
    const rollBtn = document.getElementById('rollBtn');
    const diceEl = document.getElementById('diceElement');

    const modalOverlay = document.getElementById('taskModalOverlay');
    const modalTag = document.getElementById('modalTag');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const TILE_THEMES = [
      { bg: '#f1889b', border: '#423738', shadow: '#c46274' },
      { bg: '#86d8c9', border: '#33403d', shadow: '#5bb8a7' },
      { bg: '#f9db74', border: '#423c2d', shadow: '#d6b64d' },
      { bg: '#85befa', border: '#2d3b48', shadow: '#599cdb' }
    ];

    const heartCoords = [
      { x: 280, y: 110, type: 'start' }, { x: 326, y: 72 }, { x: 376, y: 50 }, { x: 428, y: 52 },
      { x: 476, y: 80 }, { x: 508, y: 126 }, { x: 518, y: 178 }, { x: 510, y: 232 },
      { x: 486, y: 284 }, { x: 452, y: 334 }, { x: 412, y: 380 }, { x: 370, y: 422 },
      { x: 326, y: 462 }, { x: 280, y: 518 }, { x: 234, y: 462 }, { x: 190, y: 422 },
      { x: 148, y: 380 }, { x: 108, y: 334 }, { x: 74,  y: 284 }, { x: 50,  y: 232 },
      { x: 42,  y: 178 }, { x: 52,  y: 126 }, { x: 84,  y: 80 }, { x: 132, y: 52 },
      { x: 184, y: 50 }, { x: 234, y: 72 }, { x: 254, y: 128 }, { x: 280, y: 156 },
      { x: 322, y: 142 }, { x: 360, y: 140 }, { x: 400, y: 162 }, { x: 424, y: 202 },
      { x: 426, y: 248 }, { x: 408, y: 290 }, { x: 378, y: 330 }, { x: 344, y: 366 },
      { x: 308, y: 398 }, { x: 280, y: 432 }, { x: 252, y: 398 }, { x: 216, y: 366 },
      { x: 182, y: 330 }, { x: 152, y: 290 }, { x: 134, y: 248 }, { x: 136, y: 202 },
      { x: 160, y: 162 }, { x: 200, y: 140 }, { x: 238, y: 142 }, { x: 280, y: 198 },
      { x: 280, y: 242 }, { x: 280, y: 292, type: 'end' }
    ];

    const track = heartCoords.map((coord, idx) => ({
      num: idx + 1,
      x: coord.x,
      y: coord.y,
      type: coord.type || 'normal',
      theme: TILE_THEMES[idx % 4]
    }));

    const players = [
      { name: "紅方", color: "#ff4757", pos: 0, renderX: track[0].x, renderY: track[0].y },
      { name: "藍方", color: "#2e86de", pos: 0, renderX: track[0].x, renderY: track[0].y }
    ];

    let currentTurn = 0;
    let isAnimating = false;
    let lastRolledDice = 1;

    function drawRoundedRect(x, y, w, h, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.4);
      ctx.bezierCurveTo(x - size, y + size * 0.8, x, y + size * 1.1, x, y + size * 1.3);
      ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.8, x + size, y + size * 0.4);
      ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const size = 36;

      track.forEach((tile) => {
        const x = tile.x - size / 2;
        const y = tile.y - size / 2;

        ctx.fillStyle = tile.theme.shadow;
        drawRoundedRect(x, y + 3, size, size, 9);
        ctx.fill();

        ctx.fillStyle = tile.theme.bg;
        drawRoundedRect(x, y, size, size, 9);
        ctx.fill();

        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 2;
        drawRoundedRect(x, y, size, size + 3, 9);
        ctx.stroke();

        if (tile.type === 'start') {
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 15px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("◀◀", tile.x, tile.y + 1);
        } else if (tile.type === 'end') {
          ctx.fillStyle = "#333333";
          ctx.font = "bold 20px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("⚑", tile.x, tile.y);
        } else {
          drawHeart(tile.x, tile.y - 9, 7, "rgba(255, 255, 255, 0.35)");
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 14px 'Arial Black', Impact, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(tile.num, tile.x, tile.y + 2);
        }
      });

      players.forEach((p, idx) => {
        let offset = (players[0].pos === players[1].pos && !isAnimating) ? (idx === 0 ? -7 : 7) : 0;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.renderX + offset, p.renderY + offset, 10, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(p.renderX + offset, p.renderY + offset, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }

    function animateMovement(player, targetIndices, onComplete) {
      if (targetIndices.length === 0) {
        onComplete();
        return;
      }

      let leg = 0;
      let startTime = null;
      const duration = 200;

      let startX = player.renderX;
      let startY = player.renderY;
      let destX = track[targetIndices[0]].x;
      let destY = track[targetIndices[0]].y;

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const t = Math.min((timestamp - startTime) / duration, 1);
        const bounce = Math.sin(t * Math.PI) * 12;

        player.renderX = startX + (destX - startX) * t;
        player.renderY = startY + (destY - startY) * t - bounce;

        drawBoard();

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          leg++;
          if (leg < targetIndices.length) {
            startX = destX;
            startY = destY;
            destX = track[targetIndices[leg]].x;
            destY = track[targetIndices[leg]].y;
            startTime = timestamp;
            requestAnimationFrame(step);
          } else {
            player.renderX = destX;
            player.renderY = destY;
            drawBoard();
            onComplete();
          }
        }
      }
      requestAnimationFrame(step);
    }

    const dicePatterns = {
      1: [4], 2: [2, 6], 3: [2, 4, 6],
      4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
    };

    function updateDiceFace(val) {
      for (let i = 0; i < 9; i++) document.getElementById(`d${i}`).style.visibility = 'hidden';
      dicePatterns[val].forEach(idx => document.getElementById(`d${idx}`).style.visibility = 'visible');
    }

    function rollDice() {
      if (isAnimating) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      isAnimating = true;
      rollBtn.disabled = true;
      diceEl.classList.add('rolling');

      let rollCount = 0;
      const rollInterval = setInterval(() => {
        const randVal = Math.floor(Math.random() * 6) + 1;
        updateDiceFace(randVal);
        rollCount++;

        if (rollCount >= 10) {
          clearInterval(rollInterval);
          diceEl.classList.remove('rolling');
          const finalDice = Math.floor(Math.random() * 6) + 1;
          updateDiceFace(finalDice);
          lastRolledDice = finalDice;
          processTurn(finalDice);
        }
      }, 60);
    }

    function processTurn(dice) {
      const player = players[currentTurn];
      const maxIdx = track.length - 1;
      const targetPos = Math.min(player.pos + dice, maxIdx);
      const waypoints = [];
      for (let p = player.pos + 1; p <= targetPos; p++) waypoints.push(p);

      player.pos = targetPos;
      animateMovement(player, waypoints, () => showTaskModal(player, player.pos));
    }

    function showTaskModal(player, posIdx) {
      const tileNum = posIdx + 1;
      const task = tileTasks[tileNum] || { title: `第 ${tileNum} 格`, desc: "自由互動時間！", duration: 0 };

      modalTag.innerText = `${player.name} 抵達 第 ${tileNum} 格`;
      modalTag.style.background = player.color;
      modalTitle.innerText = task.title;
      modalDesc.innerText = task.desc;

      modalOverlay.classList.add('active');
      startAutoTaskTimer(task.duration);
    }

    function closeTaskModal() {
      stopTaskTimer();
      modalOverlay.classList.remove('active');

      const maxIdx = track.length - 1;
      const player = players[currentTurn];

      if (player.pos === maxIdx) {
        infoText.innerText = `👑 恭喜 ${player.name} 抵達 50 格終點獲勝！`;
        infoText.style.color = player.color;
        rollBtn.disabled = true;
        isAnimating = false;
        return;
      }

      currentTurn = 1 - currentTurn;
      infoText.innerText = `💖 輪到 ${players[currentTurn].name} (上回合擲出 ${lastRolledDice} 點)`;
      infoText.style.color = players[currentTurn].color;
      
      isAnimating = false;
      rollBtn.disabled = false;
    }

    // 初始化介面
    updateDiceFace(1);
    drawBoard();
  </script>
</body>
</html>
